variables:
    PLUGIN_NAME : 'thoth'

include:
  - project: 'documentacao-e-tarefas/modelosparaintegracaocontinua'
    ref: stable-3_4_0
    file:
      - 'templates/groups/pkp_plugin.yml'
      - 'templates/groups/omp/unit_tests.yml'

.unit_test_template:
  before_script:
    - composer install

.minimum_php_compatibility:
  before_script:
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl
    - curl -fsSL https://packages.sury.org/php/apt.gpg -o /usr/share/keyrings/deb.sury.org-php.gpg
    - . /etc/os-release && echo "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ $VERSION_CODENAME main" > /etc/apt/sources.list.d/php.list
    - apt-get update
    - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php${PHP_VERSION}-cli php${PHP_VERSION}-bcmath php${PHP_VERSION}-curl php${PHP_VERSION}-gd php${PHP_VERSION}-intl php${PHP_VERSION}-mbstring php${PHP_VERSION}-mysql php${PHP_VERSION}-xml php${PHP_VERSION}-zip
    - update-alternatives --set php /usr/bin/php${PHP_VERSION}
    - test "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = "$PHP_VERSION"
    - composer install

plugin_compatibility_omp_php_8_0:
  extends:
    - .unit_test_template
    - .minimum_php_compatibility
  stage: plugin
  needs: []
  variables:
    CI_APPLICATION_IMAGE: $CI_IMAGE_OMP
    APPLICATION: 'omp'
    APPLICATION_VERSION: '3.4.0'
    MARIADB_USER: 'omp'
    MARIADB_DATABASE: 'omp'
    MARIADB_PASSWORD: 'omp'
    MARIADB_HOST: 'mariadb'
    MARIADB_ROOT_PASSWORD: 'omp'
    PHP_VERSION: '8.0'
  script:
    - cd "$CI_PROJECT_DIR"
    - git ls-files -z -- '*.php' | xargs -0 -r -n1 php -l
    - !reference [.script_plugin_unit_test]

static_analysis:
  stage: validation
  image: $CI_IMAGE_OMP
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success
  variables:
    PHP_VERSION: '8.2'
    THOTH_PKP_ROOT: '/var/www/omp'
  before_script:
    - update-alternatives --set php /usr/bin/php$PHP_VERSION
    - composer install
  script:
    - cd "$CI_PROJECT_DIR"
    - vendor/bin/phpstan analyse --no-progress --memory-limit=512M
