[extend]
path = "/gitleaks.toml"

# This exact public fixture URL only connects disposable Thoth containers.
# Keep all default rules and continue scanning every file and real credential.
[allowlist]
description = "Public disposable Thoth PostgreSQL fixture URL"
regexTarget = "match"
regexes = ['''^postgres://thoth:isolated-test-only@thoth-db/thoth$''']
